services:
  api:
    build: .
    env_file:
      - .env
    ports:
      - "5000:5000"
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - jdpcmeris_mongo:/data/db
    ports:
      - "27017:27017"

volumes:
  jdpcmeris_mongo:
